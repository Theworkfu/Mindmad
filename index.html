<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes mentales</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#1c2733;--muted:#66788a;--line:#cfd8e1;--accent:#0f7b8a;--accent-ink:#fff;--node:#fff;--edge:#9db0c1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e6edf3;--muted:#8ea1b3;--line:#2b3947;--accent:#3cb8c9;--accent-ink:#06222a;--node:#1d2a35;--edge:#41586b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger:hover{border-color:#d0443e;color:#d0443e}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
svg#cv{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#cv.drag{cursor:grabbing}
.node rect.box{fill:var(--node);stroke-width:2}
.node text{fill:var(--ink);font-size:14px;pointer-events:none}
.node.sel rect.box{stroke-width:4}
.node{cursor:pointer}
.edge{fill:none;stroke:var(--edge);stroke-width:2}
.tog circle{fill:var(--panel);stroke:var(--edge)}
.tog text{font-size:11px;fill:var(--muted);text-anchor:middle}
aside{width:300px;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
aside h2{margin:0;font-size:13px;color:var(--muted);font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=url],input[type=password]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.thumb{max-width:100%;max-height:110px;border-radius:6px;border:1px solid var(--line);display:none}
#help{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
#drop{position:absolute;inset:10px;border:3px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:none;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none}#drop.on{display:flex}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}label.chk input{width:auto}#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:none;max-width:80%}#toast.on{display:block}
@media(max-width:760px){main{flex-direction:column}aside{width:100%;max-height:45%;border-left:0;border-top:1px solid var(--line)}#help{display:none}}
</style>
</head>
<body>
<header>
  <h1>Cartes mentales</h1>
  <select id="maps" aria-label="Carte"></select>
  <button id="bNew" class="primary">Nouvelle carte</button>
  <button id="bRen">Renommer</button>
  <button id="bDel" class="danger">Supprimer</button>
  <button id="bFit">Recentrer</button>
  <button id="bExp">Exporter</button>
  <button id="bImp">Importer</button>
  <input id="file" type="file" accept="application/json" hidden>
</header>
<main>
  <div id="stage">
    <svg id="cv" role="img" aria-label="Carte mentale"><g id="view"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="toast" role="status"></div>
    <div id="drop">Déposez l’image ici</div>
    <div id="help">Ctrl+V : coller une capture · glisser une image : nouveau nœud (ou sur un nœud pour la lui associer) · Tab : enfant · Entrée : frère</div>
  </div>
  <aside>
    <h2>Nœud sélectionné</h2>
    <label>Texte<input type="text" id="fText"></label>
    <div><div class="hint" style="margin-bottom:6px">Couleur</div><div class="row" id="sws"></div></div>
    <div class="row">
      <button id="bChild" class="primary">+ Enfant</button>
      <button id="bSib">+ Frère</button>
      <button id="bCol">Replier</button>
      <button id="bRm" class="danger">Supprimer</button>
    </div>
    <h2>Image</h2>
    <label>Adresse de l’image (URL)<input type="text" id="fImg" placeholder="https://…"></label>
    <div class="row"><button id="bUp">Importer depuis cet appareil</button><button id="bNoImg">Retirer</button></div>
    <input id="upl" type="file" accept="image/*" hidden>
    <img id="thumb" class="thumb" alt="Aperçu">
    <h2>Hébergement des images (GitHub)</h2>
    <label class="chk"><input type="checkbox" id="ghOn"> Envoyer les images déposées ou collées sur GitHub</label>
    <label>Pseudo GitHub<input type="text" id="ghOwner" autocomplete="off"></label>
    <label>Nom du dépôt<input type="text" id="ghRepo" autocomplete="off"></label>
    <label>Jeton d’accès<input type="password" id="ghTok" autocomplete="off"></label>
    <div class="row"><button id="ghTest">Tester la connexion</button></div>
    <div class="hint" id="ghState"></div>
    <label class="chk"><input type="checkbox" id="ghSync"> Sauvegarder aussi mes cartes sur GitHub (publiques)</label>
    <div class="row"><button id="ghNow">Enregistrer maintenant</button><button id="ghLoad">Charger depuis GitHub</button></div>
    <div class="hint" id="ghSyncState"></div>
  </aside>
</main>
<script>
(function(){
var NS="http://www.w3.org/2000/svg",COLORS=["#0f7b8a","#3f6fd1","#8a56c9","#d0643e","#c99a1b","#4c9a5b"];
var $=function(i){return document.getElementById(i)};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){if(!store.w){store.w=1;alert("Ce navigateur n’enregistre pas les cartes (stockage plein ou navigation privée). Exportez votre carte, ou activez la sauvegarde sur GitHub dans le panneau de droite.")}}}};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var newMap=function(t){return{id:uid(),title:t||"Ma carte",root:{id:uid(),t:"Idée centrale",c:0,img:"",col:false,ch:[]}}};
var maps=store.get("mm_maps",[]);if(!maps.length)maps=[newMap()];
var curId=store.get("mm_cur",maps[0].id);
var imgCache={};
var sel=null,tr={x:60,y:0,k:1};
function cur(){return maps.find(function(m){return m.id===curId})||maps[0]}
function save(){store.set("mm_maps",maps);store.set("mm_cur",cur().id);store.set("mm_upd",Date.now());schedulePush()}
function find(n,id,p){if(n.id===id)return{n:n,p:p};for(var i=0;i<n.ch.length;i++){var r=find(n.ch[i],id,n);if(r)return r}return null}
function imgUrl(v){return v?(imgCache[v]||v):""}

/* ---------- mise en page ---------- */
var GAP=18,HGAP=64,IMGH=90;
function size(n){n.w=Math.max(70,Math.round(n.t.length*7.8+30));n.h=34;if(n.img){n.w=Math.max(n.w,150);n.h+=IMGH+8}n.ch.forEach(size)}
function sh(n){if(n.col||!n.ch.length)return n.h;var s=0;n.ch.forEach(function(c){s+=sh(c)});s+=GAP*(n.ch.length-1);return Math.max(n.h,s)}
function place(n,x,cy,color){n.x=x;n.y=cy-n.h/2;if(n.col||!n.ch.length)return;var tot=sh(n)-0,t=cy-tot/2;
 var sum=0;n.ch.forEach(function(c){sum+=sh(c)});sum+=GAP*(n.ch.length-1);t=cy-sum/2;
 n.ch.forEach(function(c,i){var s=sh(c);place(c,x+n.w+HGAP,t+s/2);t+=s+GAP})}

/* ---------- rendu ---------- */
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function draw(){
 var m=cur(),r=m.root;size(r);place(r,0,0);
 var eg=$("edges"),ng=$("nodes");eg.innerHTML="";ng.innerHTML="";
 (function walk(n,col,depth){
  var color=COLORS[(n.c||0)%COLORS.length];
  var g=el("g",{"data-id":n.id,"class":"node"+(n.id===sel?" sel":""),transform:"translate("+n.x+","+n.y+")"},ng);
  g.addEventListener("pointerdown",function(e){e.stopPropagation()});
  g.addEventListener("click",function(e){e.stopPropagation();sel=n.id;draw();syncPanel()});
  g.addEventListener("dblclick",function(e){e.stopPropagation();sel=n.id;draw();syncPanel();$("fText").focus();$("fText").select()});
  el("rect",{"class":"box",width:n.w,height:n.h,rx:10,stroke:color},g);
  var ty=n.img?22:n.h/2+5;
  var t=el("text",{x:n.w/2,y:ty,"text-anchor":"middle"},g);t.textContent=n.t||" ";
  if(n.img){
   var cid="c"+n.id;var cp=el("clipPath",{id:cid},g);el("rect",{x:8,y:34,width:n.w-16,height:IMGH,rx:6},cp);
   var im=el("image",{x:8,y:34,width:n.w-16,height:IMGH,preserveAspectRatio:"xMidYMid slice","clip-path":"url(#"+cid+")"},g);
   im.setAttribute("href",imgUrl(n.img));
   im.addEventListener("error",function(){im.setAttribute("opacity","0.15")});
  }
  if(n.ch.length){
   var tg=el("g",{"class":"tog",transform:"translate("+(n.w+10)+","+(n.h/2)+")"},g);
   el("circle",{r:9},tg);var tt=el("text",{y:4},tg);tt.textContent=n.col?n.ch.length:"–";
   tg.addEventListener("click",function(e){e.stopPropagation();n.col=!n.col;save();draw()});
   tg.style.cursor="pointer";
  }
  if(!n.col)n.ch.forEach(function(c){
   var x1=n.x+n.w,y1=n.y+n.h/2,x2=c.x,y2=c.y+c.h/2,mx=(x1+x2)/2;
   el("path",{"class":"edge",d:"M"+x1+","+y1+" C"+mx+","+y1+" "+mx+","+y2+" "+x2+","+y2,style:"stroke:"+COLORS[(c.c||0)%COLORS.length]+"99"},eg);
   walk(c);
  });
 })(r);
 applyT();
}
function applyT(){$("view").setAttribute("transform","translate("+tr.x+","+tr.y+") scale("+tr.k+")")}
function fit(){var cv=$("cv"),W=cv.clientWidth,H=cv.clientHeight,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
 (function w(n){minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x+n.w+20);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y+n.h);if(!n.col)n.ch.forEach(w)})(cur().root);
 var k=Math.min(1.2,(W-80)/(maxx-minx),(H-80)/(maxy-miny));tr.k=k;tr.x=(W-(maxx-minx)*k)/2-minx*k;tr.y=(H-(maxy-miny)*k)/2-miny*k;applyT()}

/* ---------- panneau ---------- */
function syncPanel(){
 var f=find(cur().root,sel);var dis=!f;
 ["fText","fImg","bChild","bSib","bCol","bRm","bUp","bNoImg"].forEach(function(i){$(i).disabled=dis});
 if(!f){$("fText").value="";$("fImg").value="";$("thumb").style.display="none";return}
 $("fText").value=f.n.t;$("fImg").value=f.n.img&&f.n.img.indexOf("data:")===0?"(image importée)":f.n.img||"";
 $("bCol").textContent=f.n.col?"Déplier":"Replier";$("bRm").disabled=!f.p;$("bSib").disabled=!f.p;
 var th=$("thumb");if(f.n.img){th.src=imgUrl(f.n.img);th.style.display="block"}else th.style.display="none";
 document.querySelectorAll(".sw").forEach(function(s,i){s.classList.toggle("on",i===(f.n.c||0))});
}
function buildSw(){COLORS.forEach(function(c,i){var b=document.createElement("button");b.className="sw";b.style.background=c;b.title="Couleur "+(i+1);b.setAttribute("aria-label","Couleur "+(i+1));
 b.onclick=function(){var f=find(cur().root,sel);if(f){f.n.c=i;save();draw();syncPanel()}};$("sws").appendChild(b)})}
function refreshMaps(){var s=$("maps");s.innerHTML="";maps.forEach(function(m){var o=document.createElement("option");o.value=m.id;o.textContent=m.title;if(m.id===curId)o.selected=true;s.appendChild(o)})}

/* ---------- actions ---------- */
function addChild(){var f=find(cur().root,sel);if(!f)return;var n={id:uid(),t:"Nouvelle idée",c:f.p?f.n.c:f.n.ch.length,img:"",col:false,ch:[]};f.n.col=false;f.n.ch.push(n);sel=n.id;save();draw();syncPanel();$("fText").focus();$("fText").select()}
function addSib(){var f=find(cur().root,sel);if(!f||!f.p)return;var n={id:uid(),t:"Nouvelle idée",c:f.n.c,img:"",col:false,ch:[]};var i=f.p.ch.indexOf(f.n);f.p.ch.splice(i+1,0,n);sel=n.id;save();draw();syncPanel();$("fText").focus();$("fText").select()}
function rm(){var f=find(cur().root,sel);if(!f||!f.p)return;f.p.ch.splice(f.p.ch.indexOf(f.n),1);sel=f.p.id;save();draw();syncPanel()}
$("bChild").onclick=addChild;$("bSib").onclick=addSib;$("bRm").onclick=rm;
$("bCol").onclick=function(){var f=find(cur().root,sel);if(f){f.n.col=!f.n.col;save();draw();syncPanel()}};
$("fText").oninput=function(){var f=find(cur().root,sel);if(f){f.n.t=this.value;save();draw()}};
$("fImg").onchange=function(){var f=find(cur().root,sel);if(f){f.n.img=this.value.trim();save();draw();syncPanel()}};
$("bNoImg").onclick=function(){var f=find(cur().root,sel);if(f){f.n.img="";save();draw();syncPanel()}};
$("bUp").onclick=function(){$("upl").click()};
function readImg(file,cb){var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
 var k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
 var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.85))};im.src=rd.result};rd.readAsDataURL(file)}
var gh=store.get("mm_gh",{on:true,owner:"",repo:"",token:"",branch:"main"});
if(!gh.owner&&/\.github\.io$/.test(location.hostname)){gh.owner=location.hostname.split(".")[0];gh.repo=location.pathname.split("/")[1]||gh.owner+".github.io"}
var EXT={"image/png":"png","image/jpeg":"jpg","image/gif":"gif","image/webp":"webp"};
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},5000)}
function ghReady(){return gh.owner&&gh.repo&&gh.token}
function embed(file){return new Promise(function(r){readImg(file,r)})}
var q=Promise.resolve();function enqueue(fn){var p=q.then(fn,fn);q=p.catch(function(){});return p}
function shrink(file,max,qual){return new Promise(function(res,rej){var rd=new FileReader();rd.onerror=rej;rd.onload=function(){var im=new Image();im.onerror=function(){rej(new Error("image illisible"))};
 im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej(new Error("compression impossible"))},"image/jpeg",qual)};im.src=rd.result};rd.readAsDataURL(file)})}
function prep(file){var ext=EXT[file.type];if(ext&&file.size<=4*1048576)return Promise.resolve({blob:file,ext:ext,type:file.type});return shrink(file,2000,.88).then(function(b){return{blob:b,ext:"jpg",type:"image/jpeg"}})}
function b64(blob){return new Promise(function(res,rej){var rd=new FileReader();rd.onerror=rej;rd.onload=function(){res(String(rd.result).split(",")[1])};rd.readAsDataURL(blob)})}
function two(n){return(n<10?"0":"")+n}
function sendGh(file){return prep(file).then(function(p){return b64(p.blob).then(function(content){
 var d=new Date(),path="images/"+d.getFullYear()+"-"+two(d.getMonth()+1)+"/"+two(d.getDate())+"-"+two(d.getHours())+two(d.getMinutes())+two(d.getSeconds())+"-"+uid().slice(0,4)+"."+p.ext;
 return fetch("https://api.github.com/repos/"+gh.owner+"/"+gh.repo+"/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"Ajout d'une image",content:content,branch:gh.branch||"main"})})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(j){
  if(!r.ok){throw new Error(r.status===401?"jeton refusé":r.status===404?"dépôt introuvable ou droits insuffisants":r.status===403?"droits insuffisants":(j.message||"erreur "+r.status))}
  var url="https://raw.githubusercontent.com/"+gh.owner+"/"+gh.repo+"/"+(gh.branch||"main")+"/"+path;imgCache[url]="data:"+p.type+";base64,"+content;return url})})})})}
function toUrl(file){if(!gh.on)return embed(file);
 if(!ghReady()){toast("Renseignez le dépôt et le jeton GitHub pour héberger les images : image gardée dans la carte.");return embed(file)}
 return enqueue(function(){toast("Envoi sur GitHub…");return sendGh(file)}).then(function(u){toast("Image enregistrée sur GitHub.");return u}).catch(function(e){toast("Envoi GitHub impossible ("+e.message+") : image gardée dans la carte.");return embed(file)})}
function addImage(file,targetId,label){var pid=sel;toUrl(file).then(function(url){var m=cur(),f=targetId&&find(m.root,targetId);
 if(f){f.n.img=url;sel=f.n.id}else{var p=find(m.root,pid)||{n:m.root,p:null};var n={id:uid(),t:label||"Image",c:p.p?p.n.c:p.n.ch.length,img:url,col:false,ch:[]};p.n.col=false;p.n.ch.push(n);sel=n.id}
 save();draw();syncPanel()})}
function ghState(msg){$("ghOn").checked=!!gh.on;$("ghSync").checked=!!gh.sync;$("ghOwner").value=gh.owner||"";$("ghRepo").value=gh.repo||"";$("ghTok").value=gh.token||"";
 $("ghState").textContent=msg||(ghReady()?"Prêt : les images iront dans le dossier images de "+gh.owner+"/"+gh.repo+".":"Non configuré : les images restent dans la carte.")}
function ghSave(){store.set("mm_gh",gh);ghState()}
$("ghOn").onchange=function(){gh.on=this.checked;ghSave()};
$("ghOwner").onchange=function(){gh.owner=this.value.trim();ghSave()};
$("ghRepo").onchange=function(){gh.repo=this.value.trim();ghSave()};
$("ghTok").onchange=function(){gh.token=this.value.trim();ghSave()};
$("ghTest").onclick=function(){if(!ghReady()){ghState("Renseignez le pseudo, le dépôt et le jeton.");return}
 ghState("Test en cours…");
 fetch("https://api.github.com/repos/"+gh.owner+"/"+gh.repo,{headers:{Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json"}}).then(function(r){return r.json().then(function(j){
  if(!r.ok){ghState(r.status===401?"Jeton refusé.":r.status===404?"Dépôt introuvable : vérifiez le nom et les droits du jeton.":(j.message||"Erreur "+r.status));return}
  gh.branch=j.default_branch||"main";store.set("mm_gh",gh);
  ghState(j.private?"Connexion OK, mais le dépôt est privé : les images ne s’afficheront pas. Passez-le en public.":"Connexion OK. Les images seront publiques.")})}).catch(function(){ghState("Connexion impossible (réseau ?).")})};
ghState();

/* ---------- sauvegarde des cartes sur GitHub ---------- */
var lsOk=true;try{localStorage.setItem("mm_t","1");localStorage.removeItem("mm_t")}catch(e){lsOk=false}
var remoteSha=null,pushTimer=null,dirty=false;
function setSync(m){$("ghSyncState").textContent=m||""}
function syncOn(){return !!(ghReady()&&gh.sync)}
function api(path,opt){opt=opt||{};opt.cache="no-store";opt.headers=Object.assign({Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json"},opt.headers||{});return fetch("https://api.github.com/repos/"+gh.owner+"/"+gh.repo+path,opt)}
function mapsPath(){return "/contents/maps/maps.json?ref="+encodeURIComponent(gh.branch||"main")}
function utf8b64(str){var b=new TextEncoder().encode(str),bin="";for(var i=0;i<b.length;i+=32768)bin+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(bin)}
function getMeta(){return api(mapsPath()).then(function(r){if(r.status===404){remoteSha=null;return null}if(!r.ok)throw new Error(r.status===401?"jeton refusé":"erreur "+r.status);return r.json().then(function(j){remoteSha=j.sha;return j})})}
function pull(){return getMeta().then(function(meta){if(!meta)return null;return api(mapsPath(),{headers:{Accept:"application/vnd.github.raw+json"}}).then(function(r){if(!r.ok)throw new Error("lecture impossible");return r.json()})})}
function push(){
 function put(){var body=JSON.stringify({updated:+store.get("mm_upd",0)||Date.now(),maps:maps});return api("/contents/maps/maps.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Sauvegarde des cartes",content:utf8b64(body),branch:gh.branch||"main",sha:remoteSha||undefined})}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(r.status===401?"jeton refusé":(j.message||"erreur "+r.status));e.status=r.status;throw e}remoteSha=j.content.sha})})}
 return put().catch(function(e){if(e.status===409||e.status===422){return pull().then(function(rem){if(rem&&rem.maps)mergeRemote(rem.maps);return put()})}throw e})}
function hasContent(){return maps.some(function(m){return m.root.ch.length||m.root.img||m.root.t!=="Idée centrale"})}
function useMaps(list,upd,msg){maps=list;curId=maps[0].id;sel=null;store.set("mm_maps",maps);store.set("mm_cur",curId);store.set("mm_upd",upd);refreshMaps();draw();syncPanel();fit();setSync(msg)}
function stamp(){return "à "+new Date().toLocaleTimeString("fr-FR")}
function startSync(){if(!syncOn()||dirty)return;setSync("Vérification sur GitHub…");
 enqueue(function(){return pull().then(function(rem){var loc=+store.get("mm_upd",0)||0,ru=rem&&rem.updated||0;
  if(rem&&rem.maps&&rem.maps.length&&ru>loc){
   if(!loc&&hasContent()){var ids={};maps.forEach(function(m){ids[m.id]=1});var add=rem.maps.filter(function(m){return!ids[m.id]});useMaps(maps.concat(add),Date.now(),"Cartes de GitHub ajoutées à celles de cet appareil.");return push()}
   useMaps(rem.maps,ru,"Cartes chargées depuis GitHub.");return}
  if(!rem||loc>ru){if(!loc)store.set("mm_upd",Date.now());return push().then(function(){setSync("Cartes enregistrées sur GitHub "+stamp()+".")})}
  setSync("Cartes à jour.")})}).catch(function(e){setSync("Synchronisation impossible ("+e.message+").")})}
function sig(n){return n.t+"|"+(n.c||0)+"|"+(n.img||"")+"|"+(n.col?1:0)+"["+n.ch.map(sig).join(",")+"]"}
function mergeRemote(list){var byId={};maps.forEach(function(m){byId[m.id]=m});
 list.forEach(function(r){var l=byId[r.id];if(!l)maps.push(r);else if((l.title!==r.title||sig(l.root)!==sig(r.root))&&!maps.some(function(m){return m.title===r.title+" (autre appareil)"&&sig(m.root)===sig(r.root)})){var c=JSON.parse(JSON.stringify(r));c.id=uid();c.title=r.title+" (autre appareil)";maps.push(c)}});
 store.set("mm_maps",maps);store.set("mm_upd",Date.now());refreshMaps()}
function doPush(){if(!syncOn())return Promise.resolve();return enqueue(push).then(function(){if(!pushTimer)dirty=false;setSync("Cartes enregistrées sur GitHub "+stamp()+".")}).catch(function(e){setSync("Sauvegarde GitHub impossible ("+e.message+"). Vos cartes restent dans ce navigateur.")})}
function schedulePush(){if(!syncOn())return;dirty=true;clearTimeout(pushTimer);setSync("Modifications en attente d’envoi…");pushTimer=setTimeout(function(){pushTimer=null;doPush()},6000)}
function recheck(){if(!document.hidden&&syncOn()&&!dirty)startSync()}
document.addEventListener("visibilitychange",recheck);window.addEventListener("focus",recheck);
$("ghSync").onchange=function(){gh.sync=this.checked;store.set("mm_gh",gh);if(gh.sync){if(!ghReady())setSync("Renseignez d’abord le dépôt et le jeton.");else startSync()}else setSync("")};
$("ghNow").onclick=function(){if(!syncOn()){setSync("Cochez la sauvegarde GitHub et renseignez le jeton.");return}clearTimeout(pushTimer);pushTimer=null;setSync("Envoi…");doPush()};
$("ghLoad").onclick=function(){if(!ghReady()){setSync("Renseignez d’abord le dépôt et le jeton.");return}if(!confirm("Remplacer les cartes de cet appareil par celles de GitHub ?"))return;
 setSync("Chargement…");enqueue(pull).then(function(rem){if(!rem||!rem.maps||!rem.maps.length){setSync("Aucune sauvegarde trouvée sur GitHub.");return}useMaps(rem.maps,rem.updated||Date.now(),"Cartes chargées depuis GitHub.")}).catch(function(e){setSync("Chargement impossible ("+e.message+").")})};
if(!lsOk){toast("Ce navigateur n’enregistre pas les cartes (navigation privée ?). Activez la sauvegarde GitHub ou exportez vos cartes.");setSync("Attention : ce navigateur n’enregistre pas les cartes.")}
startSync();
$("upl").onchange=function(){var file=this.files[0];this.value="";if(file)addImage(file,sel)};
/* glisser-déposer */
var dz=$("drop"),dcount=0;
function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>-1}
window.addEventListener("dragenter",function(e){if(hasFiles(e)){dcount++;dz.classList.add("on")}});
window.addEventListener("dragleave",function(e){if(hasFiles(e)){dcount=Math.max(0,dcount-1);if(!dcount)dz.classList.remove("on")}});
window.addEventListener("dragover",function(e){if(hasFiles(e))e.preventDefault()});
window.addEventListener("drop",function(e){if(!hasFiles(e))return;e.preventDefault();dcount=0;dz.classList.remove("on");
 var nd=e.target.closest&&e.target.closest(".node"),tid=nd?nd.getAttribute("data-id"):null;
 Array.prototype.filter.call(e.dataTransfer.files,function(f){return /^image\//.test(f.type)}).forEach(function(f,i){
  addImage(f,i===0?tid:null,f.name.replace(/\.[^.]+$/,""))})});
/* coller une capture d'écran (Ctrl+V / Cmd+V) */
document.addEventListener("paste",function(e){var items=(e.clipboardData||{}).items||[];
 for(var i=0;i<items.length;i++){if(items[i].kind==="file"&&/^image\//.test(items[i].type)){e.preventDefault();addImage(items[i].getAsFile(),null,"Capture");return}}});
$("maps").onchange=function(){curId=this.value;sel=null;save();draw();syncPanel();fit()};
$("bNew").onclick=function(){var t=prompt("Titre de la carte :","Nouvelle carte");if(!t)return;var m=newMap(t);m.root.t=t;maps.push(m);curId=m.id;sel=m.root.id;save();refreshMaps();draw();syncPanel();fit()};
$("bRen").onclick=function(){var t=prompt("Nouveau titre :",cur().title);if(t){cur().title=t;save();refreshMaps()}};
$("bDel").onclick=function(){if(!confirm("Supprimer la carte « "+cur().title+" » ?"))return;maps=maps.filter(function(m){return m.id!==curId});if(!maps.length)maps=[newMap()];curId=maps[0].id;sel=null;save();refreshMaps();draw();syncPanel();fit()};
$("bFit").onclick=fit;
$("bExp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(cur(),null,1)],{type:"application/json"}));a.download=cur().title.replace(/[^\w\-]+/g,"_")+".json";a.click()};
$("bImp").onclick=function(){$("file").click()};
$("file").onchange=function(){var file=this.files[0];this.value="";if(!file)return;var rd=new FileReader();rd.onload=function(){try{var m=JSON.parse(rd.result);if(!m.root)throw 0;m.id=uid();maps.push(m);curId=m.id;sel=null;save();refreshMaps();draw();syncPanel();fit()}catch(e){alert("Fichier invalide : choisissez une carte exportée depuis cet outil.")}};rd.readAsText(file)};

/* ---------- pan / zoom / clavier ---------- */
var cv=$("cv"),pan=null;
cv.addEventListener("pointerdown",function(e){pan={x:e.clientX-tr.x,y:e.clientY-tr.y};cv.classList.add("drag");cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",function(e){if(pan){tr.x=e.clientX-pan.x;tr.y=e.clientY-pan.y;applyT()}});
cv.addEventListener("pointerup",function(){pan=null;cv.classList.remove("drag")});
cv.addEventListener("click",function(){sel=null;draw();syncPanel()});
cv.addEventListener("wheel",function(e){e.preventDefault();var r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,k2=Math.max(.2,Math.min(3,tr.k*(e.deltaY<0?1.1:.9)));
 tr.x=px-(px-tr.x)*k2/tr.k;tr.y=py-(py-tr.y)*k2/tr.k;tr.k=k2;applyT()},{passive:false});
document.addEventListener("keydown",function(e){
 var inField=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
 if(e.key==="Tab"&&sel&&!(inField&&document.activeElement.id!=="fText")){e.preventDefault();addChild()}
 else if(e.key==="Enter"&&sel&&document.activeElement.id!=="fImg"&&!/SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();addSib()}
 else if((e.key==="Delete")&&!inField){rm()}
});

buildSw();refreshMaps();sel=cur().root.id;draw();syncPanel();fit();
window.addEventListener("resize",fit);
})();
</script>
