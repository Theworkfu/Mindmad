<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes mentales</title>
<style>
:root{--link:#7b5cd6;--bg:#eef2f6;--panel:#fff;--ink:#1c2733;--muted:#66788a;--line:#cfd8e1;--accent:#0f7b8a;--accent-ink:#fff;--node:#fff;--edge:#9db0c1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--link:#ad9bf2;--bg:#10171d;--panel:#18222b;--ink:#e6edf3;--muted:#8ea1b3;--line:#2b3947;--accent:#3cb8c9;--accent-ink:#06222a;--node:#1d2a35;--edge:#41586b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:6px 10px;min-height:44px;background:var(--panel);border-bottom:1px solid var(--line)}
#mTitle{font-weight:700;font-size:16px;line-height:42px;height:44px;padding:0 16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.25);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#mTitle:hover{border-color:var(--accent)}#mTitle input{font:inherit;font-weight:700;line-height:normal;height:32px;padding:0 6px;width:min(60vw,320px);vertical-align:middle}
#tl{position:absolute;left:12px;top:12px;z-index:22;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 92px)}
#fabC{position:absolute;right:12px;top:12px;z-index:22}
.rd{width:44px;height:44px;border-radius:50%;padding:0;font-size:22px;line-height:1;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.25)}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger:hover{border-color:#d0443e;color:#d0443e}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
svg#cv{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#cv.drag{cursor:grabbing}
.node rect.box{fill:var(--node);stroke-width:2}
.node text{fill:var(--ink);font-size:14px;pointer-events:none}
.node.sel rect.box{stroke-width:5;fill:color-mix(in srgb,var(--sc,var(--accent)) 16%,var(--node));filter:drop-shadow(0 0 7px var(--sc,var(--accent))) drop-shadow(0 0 2px var(--sc,var(--accent)))}
.node{cursor:grab;user-select:none;-webkit-user-select:none}
.edge{fill:none;stroke:var(--edge);stroke-width:2}
.tog circle{fill:var(--panel);stroke:var(--edge)}
.tog text{font-size:11px;fill:var(--muted);text-anchor:middle}
aside{position:fixed;top:92px;right:12px;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 112px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;transform:translateY(-8px);opacity:0;transition:transform .15s,opacity .15s;box-shadow:0 8px 24px rgba(0,0,0,.25);visibility:hidden}
aside.on{transform:none;opacity:1;visibility:visible}
aside h2{margin:0;font-size:13px;color:var(--muted);font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=url],input[type=password],textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.thumb{max-width:100%;max-height:110px;border-radius:6px;border:1px solid var(--line);display:none}
#help{position:absolute;right:82px;bottom:14px;z-index:21;display:none;max-width:min(430px,calc(100% - 90px));font-size:12px;line-height:1.6;color:var(--ink);background:var(--panel);padding:10px 12px;border-radius:10px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25)}#help.on{display:block}
#help div{margin:3px 0}#help i.m{font-style:normal;display:inline-flex;align-items:center;gap:2px;white-space:nowrap;color:var(--ink);font-weight:700}.ms{width:13px;height:18px}
#fabs{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:22;display:flex;flex-direction:column;gap:10px}
.fab svg{display:block;margin:auto}
#ver{position:absolute;right:12px;top:70px;width:56px;text-align:center;font-size:11px;color:var(--muted);z-index:22;pointer-events:none}
.grp{fill:color-mix(in srgb,var(--accent) 7%,transparent);stroke:var(--muted);stroke-width:1.7;stroke-dasharray:7 6;pointer-events:all;cursor:move}
svg#cv.selmode,svg#cv.selmode .node{cursor:crosshair}svg#cv.movemode,svg#cv.movemode .node{cursor:move}
#selov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:18}
#selov rect,#selov path{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 4}
#selhint{position:absolute;left:14px;bottom:14px;z-index:23;display:none;align-items:center;gap:8px;max-width:calc(100% - 110px);padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px}
#selhint.on{display:flex}#selhint svg{flex:none;color:var(--accent)}
.badge{position:absolute;top:7px;right:8px;width:17px;height:17px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;pointer-events:none}
.badge.ok{display:flex;background:none;border:0;color:inherit}.badge.ok svg{width:16px;height:16px}
.badge.warn{display:flex;background:#f5c518;color:#1a1a1a;border:1px solid rgba(0,0,0,.3)}.fab{width:56px;height:56px;border-radius:50%;padding:0;font-size:28px;font-weight:700;line-height:1;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.25)}.fab:hover{border-color:var(--accent);color:var(--accent)}
#drop{position:absolute;inset:10px;border:3px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:none;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none}#drop.on{display:flex}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}label.chk input{width:auto}#toast{position:absolute;left:50%;bottom:22px;z-index:23;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:none;max-width:calc(100% - 180px)}#toast.on{display:block}
#lb{position:fixed;inset:0;z-index:50;background:rgba(8,12,16,.78);display:none;align-items:center;justify-content:center;padding:24px}
#lb.on{display:flex}
#lbi{max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);background:var(--panel);cursor:default}
#lbx{position:absolute;top:14px;right:16px;width:36px;height:36px;border-radius:50%;padding:0;font-size:20px;line-height:1;background:var(--panel)}
.thumb{cursor:zoom-in}
textarea#fText{resize:vertical;font:inherit}
#ed,#nt{position:fixed;inset:0;z-index:40;background:rgba(8,12,16,.55);display:none;align-items:center;justify-content:center;padding:24px}
#ed.on,#nt.on{display:flex}
#edc,#ntc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(480px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
#edt,#ntt{width:100%;min-height:120px;resize:vertical;font:inherit;font-size:15px;line-height:1.4;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lkline{fill:none;stroke:var(--lc,var(--edge));stroke-width:2;pointer-events:none}
.lkhit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
.lk.sel .lkline{stroke:var(--link);stroke-width:3.5}
.lkarrow{fill:var(--lc,var(--edge));pointer-events:none}.lk.sel .lkarrow{fill:var(--link)}
.lktext{font-size:11px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:all;cursor:text}
body.linking .node{cursor:crosshair}
.lrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lname{width:100%;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow input{flex:1;min-width:0;padding:4px 6px}
.lrow button{padding:2px 9px}
button:disabled{opacity:.4;cursor:default}

.lkh{fill:var(--panel);stroke:var(--link);cursor:grab}
.lkh.m{fill:var(--link)}.lkh.ctl{fill:var(--link);stroke:var(--panel)}
.lkctl{fill:none;stroke:var(--link);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
.node.dropt{filter:drop-shadow(0 0 9px var(--accent))}
.node.dro
